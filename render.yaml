services:
  - type: web
    name: spotify-age-research-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set manually in Render dashboard (your Vercel URL)
